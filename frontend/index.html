<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QuietWay — sensory-friendly routes in Melbourne</title>
    <meta
      name="description"
      content="Live crowd levels, sensory-risk scored routes and quiet landmarks across the City of Melbourne."
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint, so there's no flash of the wrong
      // theme while main.js loads. Kept out of main.js deliberately — it
      // must run synchronously, before any CSS has had a chance to render.
      (function () {
        var stored = localStorage.getItem('quietway-theme')
        var theme = stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
